<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <title>一起找結構</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "DFKai-sb", "標楷體", serif;
            background: linear-gradient(#7cc7ff, #bfeec4);
            overflow: hidden;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .active {
            display: flex;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 800px;
            width: 90%;
            position: relative;
        }
        h1 {
            margin: 10px 0;
            font-size: 42px;
        }
        h2, h3 {
            margin: 10px 0;
        }
        .leaf {
            position: fixed;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #e8ffb2, #6bbf4e);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            animation: floatLeaf 10s linear infinite;
            z-index: -1;
        }
        .leaf.leaf1 { top: 5%; left: 10%; animation-delay: 0s; }
        .leaf.leaf2 { top: 15%; right: 15%; animation-delay: 2s; }
        .leaf.leaf3 { bottom: 10%; left: 20%; animation-delay: 4s; }
        @keyframes floatLeaf {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(25px) rotate(15deg); }
            100% { transform: translateY(0) rotate(-10deg); }
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 21px 33px;
            margin: 10px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #ffda79, #ffc857);
            color: #5a3d0b;
            font-size: 27px;
            box-shadow: 0 6px 0 #c49b37;
            transition: all 0.2s;
            font-family: "DFKai-sb", "標楷體", serif;
            flex: 1 1 390px;
            max-width: 540px;
            box-sizing: border-box;
        }
        .btn span.emoji {
            font-size: 30px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #ffe9a9, #ffd46f);
            transform: translateY(-1px);
            box-shadow: 0 7px 0 #c49b37;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c49b37;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #bde0fe, #89c2ff);
            box-shadow: 0 6px 0 #4a74a5;
            color: #073b4c;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ffb4b4, #ff8787);
            box-shadow: 0 6px 0 #b04646;
            color: #5b1515;
        }
        .btn.correct-highlight {
            background: linear-gradient(135deg, #a8e6cf, #88d8a3) !important;
            box-shadow: 0 6px 0 #5fa285 !important;
            animation: glow 1s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 6px 0 #5fa285, 0 0 20px rgba(88, 216, 163, 0.5); }
            to { box-shadow: 0 6px 0 #5fa285, 0 0 30px rgba(88, 216, 163, 0.8); }
        }
        /* 中間提示遮罩：20% 變暗 */
        .feedback-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }
        .feedback-overlay.active {
            display: flex;
        }
        .feedback-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-size: 36px;
            font-weight: bold;
            min-width: 200px;
        }
        .feedback-correct {
            color: #00b894;
        }
        .feedback-try-again {
            color: #f39c12;
        }
        .pause-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .version-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 18px;
        }
        .home-structure-btn-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }
        .home-structure-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            font-size: 22px;
        }
        .home-grid-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            justify-content: center;
        }
        .home-grid-icon, .grid-icon {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            border: 3px solid #3a5f0b;
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
        }
        .home-grid-icon.equal::before,
        .grid-icon.equal::before { top: 50%; }
        .home-grid-icon.top-small::before,
        .grid-icon.top-small::before { top: 35%; }
        .home-grid-icon.bottom-small::before,
        .grid-icon.bottom-small::before { top: 65%; }
        .home-grid-icon::before,
        .grid-icon::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 4px solid #3a5f0b;
            transform: translateY(-50%);
            height: 0;
        }
        @media (max-width: 600px) {
            .btn {
                flex: 1 1 100%;
                max-width: 100%;
                font-size: 30px;
                padding: 22px 24px;
            }
            .home-grid-icon, .grid-icon {
                width: 84px;
                height: 84px;
            }
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .game-info { font-size: 20px; }
        .farm-bg {
            position: relative;
            margin-top: 10px;
            border-radius: 16px;
            background: linear-gradient(#9be7ff, #a5e6b3);
            padding: 10px 10px 90px;
            overflow: visible;
            z-index: 0;
        }
        .ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 25%;
            background: linear-gradient(#7cc77a, #4e8b4e);
            border-radius: 20px 20px 0 0;
            z-index: 0;
        }

        /* 精準紅線位置 */
        .apple-word.cue-line.equal::after {
            top: 50%;
        }
        .apple-word.cue-line.top-small::after {
            top: 35%; /* 上小下大：靠近頂部 */
        }
        .apple-word.cue-line.bottom-small::after {
            top: 65%; /* 上大下小：靠近底部 */
        }
        /* Moveable Redline */
        #redline {
            position: absolute;
            height: 5px;
            background: #ff4444;
            box-shadow: 0 0 5px rgba(255, 68, 68, 0.9);
            width: 80%;
            top: 50%;
            left: 10%;
            cursor: grab;
            z-index: 4;
        }
        .apple-word {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto;
            background: radial-gradient(circle at 30% 30%, #ffe5e5, #ff4a4a);
            border-radius: 50%;
            box-shadow: 0 6px 0 #b32626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            color: #fff;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.4);
            margin-top: 30px;
            transition: transform 0.15s ease-out;
            z-index: 2;
        }
        .apple-stem {
            position: absolute;
            top: -18px;
            width: 10px;
            height: 25px;
            background: #5b3c1d;
            border-radius: 4px;
        }
        .apple-leaf {
            position: absolute;
            top: -10px;
            left: 14px;
            width: 24px;
            height: 14px;
            background: linear-gradient(135deg, #e8ffb2, #6bbf4e);
            border-radius: 50px 0 50px 50px;
        }
        .structure-choices {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 3;
        }
        .structure-btn-content {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
        }
        .structure-btn-text {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .score-popup {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        .pause-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 4;
            transform: scale(0.7);
            transform-origin: bottom right;
        }
        .overlay, .game-over-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .overlay.active, .game-over-overlay.active {
            display: flex;
        }
        .correct-answer {
            background: linear-gradient(135deg, #a8e6cf, #88d8a3) !important;
            box-shadow: 0 6px 0 #5fa285 !important;
        }
    </style>
</head>
<body>
    <!-- 漂浮葉子 -->
    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>
    <!-- 中間提示遮罩 -->
    <div id="feedbackOverlay" class="feedback-overlay">
        <div id="feedbackCard" class="feedback-card"></div>
    </div>
    <!-- 首頁 -->
    <div id="homeScreen" class="screen active">
        <div class="card">
            <h1>一起找結構 🍎</h1>
            <h3>請選擇遊戲：</h3>
            <div class="version-options">
                <button class="btn" data-version="two-struct">
                    <div class="home-structure-btn-content">
                        <div class="home-structure-text">
                            <span class="emoji">🐣</span>
                            <span>上大下小 / 上小下大</span>
                            <div class="home-grid-row">
                                <div class="home-grid-icon bottom-small" title="上大下小"></div>
                                <div class="home-grid-icon top-small" title="上小下大"></div>
                            </div>
                        </div>
                    </div>
                </button>
                <button class="btn" data-version="three-struct">
                    <div class="home-structure-btn-content">
                        <div class="home-structure-text">
                            <span class="emoji">🐥</span>
                            <span>上大下小 / 上小下大 / 上下相等</span>
                            <div class="home-grid-row">
                                <div class="home-grid-icon bottom-small" title="上大下小"></div>
                                <div class="home-grid-icon top-small" title="上小下大"></div>
                                <div class="home-grid-icon equal" title="上下相等"></div>
                            </div>
                        </div>
                    </div>
                </button>
            </div>
        </div>
    </div>
    <!-- 遊戲畫面 -->
    <div id="gameScreen" class="screen">
        <div class="card" style="width: 95%; max-width: 900px;">
            <div class="game-header">
                <div class="game-info">
                    <div>遊戲：<span id="versionLabel"></span></div>
                    <div>題數：<span id="questionCount">1/10</span></div>
                </div>
                <div class="game-info">
                    <div>分數：<span id="scoreDisplay">0</span></div>
                </div>
            </div>
            <div class="farm-bg" style="height: 420px;">
                <div class="ground"></div>
                <div class="apple-word" id="appleWord">
                    <div class="apple-stem"></div>
                    <div class="apple-leaf"></div>
                    <span id="currentChar">背</span>
                    <div id="redline"></div>
                </div>
                <div class="structure-choices" id="structureChoices"></div>
                <div class="pause-container">
                    <button class="btn btn-secondary" id="pauseBtn">
                        <span class="emoji">⏸️</span><span>暫停</span>
                    </button>
                </div>
            </div>
            <div style="margin-top:8px; font-size:16px; color:#4a4a4a;">
                提示：點擊下方正確的結構，每答對 +10 分，答錯有三次機會！
            </div>
        </div>
    </div>
    <!-- 暫停畫面 -->
    <div id="pauseOverlay" class="overlay">
        <div class="card">
            <h2>遊戲已暫停 ⏸️</h2>
            <p>請選擇要繼續遊戲或返回主頁。</p>
            <div class="pause-buttons">
                <button class="btn btn-secondary" id="resumeBtn">
                    <span class="emoji">▶️</span><span>繼續遊戲</span>
                </button>
                <button class="btn btn-danger" id="pauseToHomeBtn">
                    <span class="emoji">🏠</span><span>返回主頁</span>
                </button>
            </div>
        </div>
    </div>
    <!-- 遊戲結束畫面 -->
    <div id="gameOverOverlay" class="game-over-overlay">
        <div class="card">
            <h2>恭喜完成！🎉</h2>
            <p>最終分數：<span id="finalScore">0</span> 分</p>
            <div class="pause-buttons">
                <button class="btn btn-secondary" id="replayBtn">
                    <span class="emoji">🔁</span><span>再玩一次</span>
                </button>
                <button class="btn btn-danger" id="gameOverToHomeBtn">
                    <span class="emoji">🏠</span><span>返回主頁</span>
                </button>
            </div>
        </div>
    </div>
    <script>
        const wordsEqual = ["樂","習","香","忘","要","早","音","男","思","忠","志","益"];
        const wordsTopSmall = ["眾","花","室","前","家","字","完","寳","笑","安","箏","晨","最"];
        const wordsBottomSmall = ["照","熱","書","感","煮","具","烈","盟","興","想","盛","杰","旦"];
        const structureNameMap = {
            equal: "上下相等",
            "top-small": "上小下大",
            "bottom-small": "上大下小"
        };
        let version = "two-struct";
        let score = 0;
        let questionCount = 0;
        let maxQuestions = 10;
        let gamePaused = false;
        let currentChar = "";
        let currentCharStructure = "";
        let errorCount = 0;
        let correctButton = null;
        let usedWords = new Set();
        let highlightTimeout = null;
        let feedbackTimeout = null;

        const homeScreen = document.getElementById("homeScreen");
        const gameScreen = document.getElementById("gameScreen");
        const pauseOverlay = document.getElementById("pauseOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const feedbackOverlay = document.getElementById("feedbackOverlay");
        const feedbackCard = document.getElementById("feedbackCard");
        const versionLabel = document.getElementById("versionLabel");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const questionCountDisplay = document.getElementById("questionCount");
        const currentCharSpan = document.getElementById("currentChar");
        const structureChoicesDiv = document.getElementById("structureChoices");
        const finalScoreSpan = document.getElementById("finalScore");
        const appleWordDiv = document.getElementById("appleWord");
        const redline = document.getElementById("redline");

        function showScreen(screen) {
            document.querySelectorAll('.screen, .overlay, .game-over-overlay').forEach(s => s.classList.remove("active"));
            screen.classList.add("active");
        }

        function showFeedback(message, isCorrect) {
            feedbackCard.textContent = message;
            feedbackCard.className = `feedback-card ${isCorrect ? 'feedback-correct' : 'feedback-try-again'}`;
            feedbackOverlay.classList.add("active");
        
            feedbackTimeout = setTimeout(() => {
                feedbackOverlay.classList.remove("active");
            }, 1500);
        }

        function getUniqueWord(pool) {
            const available = pool.filter(word => !usedWords.has(word));
            if (available.length === 0) {
                usedWords.clear();
                return pool[Math.floor(Math.random() * pool.length)];
            }
            return available[Math.floor(Math.random() * available.length)];
        }

        function getStructureOfChar(ch) {
            if (wordsEqual.includes(ch)) return "equal";
            if (wordsTopSmall.includes(ch)) return "top-small";
            if (wordsBottomSmall.includes(ch)) return "bottom-small";
            return "equal";
        }

        function createScorePopup(text, color) {
            const popup = document.createElement("div");
            popup.className = "score-popup";
            popup.textContent = text;
            popup.style.color = color;
            const rect = appleWordDiv.getBoundingClientRect();
            popup.style.left = rect.left + rect.width / 2 + "px";
            popup.style.top = rect.top + "px";
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 650);
        }

        // 改進音效：正確高音、錯誤低音
        function playSound(frequency, duration = 0.2) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
            
                osc.type = "sine"; // 改用sine波更悅耳
                osc.frequency.value = frequency;
            
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            
                osc.connect(gain);
                gain.connect(ctx.destination);
            
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        // 正確音效 (高音階)
        function playCorrectSound() {
            playSound(800, 0.25);
        }

        // 錯誤音效 (低音階)
        function playWrongSound() {
            playSound(400, 0.3);
        }

        document.querySelectorAll("#homeScreen .btn[data-version]").forEach(btn => {
            btn.addEventListener("click", () => {
                version = btn.getAttribute("data-version");
                startGame();
            });
        });

        function startGame() {
            showScreen(gameScreen);
            gamePaused = false;
            score = 0;
            questionCount = 0;
            errorCount = 0;
            usedWords.clear();
            scoreDisplay.textContent = score;
            questionCountDisplay.textContent = "1/10";
            versionLabel.textContent =
                version === "two-struct"
                    ? "上大下小 / 上小下大"
                    : "上大下小 / 上小下大 / 上下相等";
            buildStructureButtonsForVersion();
            changeWord();
        }

        function getWordPoolForVersion() {
            if (version === "two-struct") {
                return [...wordsTopSmall, ...wordsBottomSmall];
            } else {
                return [...wordsEqual, ...wordsTopSmall, ...wordsBottomSmall];
            }
        }

        function changeWord() {
            questionCount++;
            questionCountDisplay.textContent = `${questionCount}/${maxQuestions}`;
        
            if (questionCount > maxQuestions) {
                endGame();
                return;
            }

            errorCount = 0;
            if (currentChar) usedWords.add(currentChar);
            const pool = getWordPoolForVersion();
            currentChar = getUniqueWord(pool);
            usedWords.add(currentChar);
            currentCharStructure = getStructureOfChar(currentChar);
            currentCharSpan.textContent = currentChar;
            appleWordDiv.classList.remove("cue-line");
        
            if (correctButton) {
                correctButton.classList.remove("correct-highlight");
                clearTimeout(highlightTimeout);
            }
            appleWordDiv.style.transform = "translateY(-6px) scale(1.04)";
            setTimeout(() => {
                appleWordDiv.style.transform = "translateY(0) scale(1)";
            }, 150);
        
            buildStructureButtonsForVersion();
            
            // Reset redline position
            redline.style.top = "50%";
            redline.style.left = "10%";
            redline.style.display = "none"; // Hide redline initially
        }

        function endGame() {
            finalScoreSpan.textContent = score;
            showScreen(gameOverOverlay);
        }

        function buildStructureButtonsForVersion() {
            structureChoicesDiv.innerHTML = "";
            correctButton = null;
            let structuresToShow = [];
            if (version === "two-struct") {
                structuresToShow = ["bottom-small", "top-small"];
            } else {
                structuresToShow = ["bottom-small", "top-small", "equal"];
            }

            structuresToShow.forEach(structKey => {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.dataset.struct = structKey;
                const label = structureNameMap[structKey];
                const emojiSpan = document.createElement("span");
                emojiSpan.className = "emoji";
                emojiSpan.textContent =
                    structKey === "equal" ? "📏" : structKey === "top-small" ? "⬆️" : "⬇️";
                const textSpan = document.createElement("span");
                textSpan.textContent = label;
                const textRow = document.createElement("div");
                textRow.className = "structure-btn-text";
                textRow.appendChild(emojiSpan);
                textRow.appendChild(textSpan);
                const grid = document.createElement("div");
                grid.className = `grid-icon ${structKey}`;
                const contentDiv = document.createElement("div");
                contentDiv.className = "structure-btn-content";
                contentDiv.appendChild(textRow);
                contentDiv.appendChild(grid);
                btn.appendChild(contentDiv);
                if (structKey === currentCharStructure) {
                    correctButton = btn;
                }
                btn.addEventListener("click", () => handleStructureClick(structKey, btn));
                structureChoicesDiv.appendChild(btn);
            });
        }

        function handleStructureClick(chosenStruct, btn) {
            if (gamePaused || feedbackOverlay.classList.contains("active")) return;

            if (chosenStruct === currentCharStructure) {
                score += (errorCount === 0) ? 10 : 5;
                playCorrectSound();
                createScorePopup(errorCount === 0 ? "+10" : "+5", "#00b894");
                scoreDisplay.textContent = score;
                showFeedback("✅ 正確！", true);
                setTimeout(changeWord, 1500);
            } else {
                errorCount++;
                score -= 5;
                if (score < 0) score = 0;
                playWrongSound();
                createScorePopup("-5", "#d63031");
                scoreDisplay.textContent = score;

                if (errorCount === 1) {
                    showFeedback("再試一次！💪", false);
                } else if (errorCount === 2) {
                    // Show moveable redline
                    redline.style.display = "block";
                    showFeedback("移動紅線來分析文字！🔍", false);
                    
                    // Make redline draggable
                    let isDragging = false;
                    let offsetX, offsetY;

                    redline.addEventListener('mousedown', function(e) {
                        isDragging = true;
                        offsetX = e.clientX - redline.offsetLeft;
                        offsetY = e.clientY - redline.offsetTop;
                        redline.style.cursor = 'grabbing';
                    });

                    document.addEventListener('mousemove', function(e) {
                        if (!isDragging) return;

                        let x = e.clientX - offsetX;
                        let y = e.clientY - offsetY;

                        // Keep redline within appleWord bounds
                        const appleRect = appleWordDiv.getBoundingClientRect();
                        const redlineRect = redline.getBoundingClientRect();

                        let minY = appleRect.top - redlineRect.height / 2 - appleRect.top + 5;
                        let maxY = appleRect.bottom - redlineRect.height / 2 - appleRect.top - 5;

                        if (y < minY) {
                            y = minY;
                        } else if (y > maxY) {
                            y = maxY;
                        }

                        redline.style.top = y + 'px';
                    });

                    document.addEventListener('mouseup', function() {
                        isDragging = false;
                        redline.style.cursor = 'grab';
                    });
                } else if (errorCount === 3) {
                    showFeedback("最後機會！", false);
                } else {
                    // Fourth wrong answer: show correct answer in green
                    btn.classList.add("correct-answer");
                    showFeedback("答案是...", false);
                    setTimeout(() => {
                        changeWord();
                    }, 2000);
                }
            }
        }

        document.getElementById("pauseBtn").addEventListener("click", () => {
            gamePaused = true;
            if (feedbackTimeout) clearTimeout(feedbackTimeout);
            if (highlightTimeout) clearTimeout(highlightTimeout);
            pauseOverlay.classList.add("active");
        });

        document.getElementById("resumeBtn").addEventListener("click", () => {
            gamePaused = false;
            pauseOverlay.classList.remove("active");
        });

        document.getElementById("pauseToHomeBtn").addEventListener("click", () => {
            pauseOverlay.classList.remove("active");
            if (feedbackTimeout) clearTimeout(feedbackTimeout);
            if (highlightTimeout) clearTimeout(highlightTimeout);
            showScreen(homeScreen);
        });

        document.getElementById("replayBtn").addEventListener("click", () => {
            gameOverOverlay.classList.remove("active");
            startGame();
        });

        document.getElementById("gameOverToHomeBtn").addEventListener("click", () => {
            gameOverOverlay.classList.remove("active");
            showScreen(homeScreen);
        });
    </script>
</body>
</html>
